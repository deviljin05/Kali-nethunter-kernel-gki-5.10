name: Build NetHunter GKI 5.10 Kernel (KernelSU + SUSFS + BBRv3 + Droidspaces)

# ─────────────────────────────────────────────────────────────────────────
# MANUAL TRIGGER — Actions tab > "Run workflow" se chalao, sab inputs fill karo
# ─────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      device_codename:
        description: "Device codename (jaise: raven, lynx, oriole)"
        required: true
        type: string
      defconfig:
        description: "Kernel defconfig name (jaise: gki_defconfig)"
        required: true
        default: "gki_defconfig"
        type: string
      gki_manifest_branch:
        description: "AOSP GKI kernel manifest branch"
        required: true
        default: "common-android12-5.10"
        type: choice
        options:
          - "common-android12-5.10"
          - "common-android13-5.10"
      ksu_variant:
        description: "KernelSU variant"
        required: true
        default: "KernelSU-Next"
        type: choice
        options:
          - "KernelSU-Next"
          - "KernelSU"
      susfs_branch:
        description: "susfs4ksu branch (GKI branch se match karo)"
        required: true
        default: "gki-android12-5.10"
        type: string
      enable_nethunter:
        description: "Kali NetHunter kernel patches apply karein?"
        required: true
        default: true
        type: boolean
      enable_bbrv3:
        description: "BBRv3 TCP congestion control patch"
        required: true
        default: true
        type: boolean
      enable_droidspaces:
        description: "Droidspaces (container runtime) patch"
        required: true
        default: true
        type: boolean
      extra_defconfig:
        description: "Comma separated extra CONFIG_ flags (optional, jaise CONFIG_ANDROID_PARANOID_NETWORK=n)"
        required: false
        default: ""
        type: string

env:
  KERNEL_DIR: ${{ github.workspace }}/kernel_workspace
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      # ── 0. Repo checkout (agar tum ne apne khud ke extra patches/configs is repo mein rakhe hain) ──
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      # ── 1. Disk space free karo, GKI build ~40-60GB tak use kar sakta hai ──
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # ── 2. Build dependencies ──
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            libssl-dev libelf-dev python3 python-is-python3 \
            cpio rsync unzip git git-lfs zip gnupg \
            libncurses-dev lz4 zstd device-tree-compiler \
            openjdk-17-jre-headless

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.device_codename }}-${{ inputs.gki_manifest_branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.device_codename }}-${{ inputs.gki_manifest_branch }}-

      # ── 3. GKI 5.10 kernel source sync (Google ka official manifest) ──
      - name: Sync GKI kernel source
        run: |
          mkdir -p "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          git config --global user.name "gh-actions"
          git config --global user.email "actions@github.com"
          repo init -u https://android.googlesource.com/kernel/manifest -b ${{ inputs.gki_manifest_branch }} --depth=1
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --optimized-fetch

      - name: Locate kernel source + clang toolchain
        id: paths
        run: |
          cd "$KERNEL_DIR"
          KSRC=$(find . -maxdepth 2 -type d -name "common" | head -n1)
          CLANG=$(find . -maxdepth 4 -type d -path "*clang*" | head -n1)
          echo "ksrc=$KERNEL_DIR/${KSRC#./}" >> "$GITHUB_OUTPUT"
          echo "clang=$KERNEL_DIR/${CLANG#./}" >> "$GITHUB_OUTPUT"
          echo "Kernel source: $KSRC"
          echo "Clang path: $CLANG"

      # ── 4. KernelSU inject karo ──
      - name: Add KernelSU
        working-directory: ${{ steps.paths.outputs.ksrc }}
        run: |
          if [ "${{ inputs.ksu_variant }}" = "KernelSU-Next" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          else
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          fi

      # ── 5. SUSFS (latest) patches — simonpunk ka official gitlab repo ──
      - name: Fetch and apply SUSFS
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git clone --depth=1 -b ${{ inputs.susfs_branch }} https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          KSRC="${{ steps.paths.outputs.ksrc }}"
          cp susfs4ksu/kernel_patches/fs/* "$KSRC/fs/"
          cp susfs4ksu/kernel_patches/include/linux/* "$KSRC/include/linux/"
          cd "$KSRC"
          # kernel side patch
          PATCH_FILE=$(find "$GITHUB_WORKSPACE/kernel_workspace/susfs4ksu/kernel_patches" -maxdepth 1 -name "50_add_susfs_in_gki-*.patch" | head -n1)
          patch -p1 --fuzz=3 < "$PATCH_FILE" || echo "::warning::SUSFS kernel patch me conflicts aa sakte hain, manually resolve karna ho sakta hai"
          # KernelSU side patch
          KSU_PATCH=$(find "$GITHUB_WORKSPACE/kernel_workspace/susfs4ksu/kernel_patches/KernelSU" -name "10_enable_susfs_for_ksu.patch" | head -n1)
          if [ -n "$KSU_PATCH" ] && [ -d KernelSU ]; then
            (cd KernelSU && patch -p1 --fuzz=3 < "$KSU_PATCH") || echo "::warning::SUSFS KernelSU-side patch conflict, KSU_VARIANT ka built-in susfs support check karo"
          fi

      # ── 6. BBRv3 patch (WildKernels ka patch set) ──
      - name: Apply BBRv3 patch
        if: ${{ inputs.enable_bbrv3 == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git wild_patches
          KSRC="${{ steps.paths.outputs.ksrc }}"
          BBR_PATCH=$(find wild_patches/bbrv3 -iname "*.patch" | head -n1)
          if [ -n "$BBR_PATCH" ]; then
            (cd "$KSRC" && patch -p1 --fuzz=3 < "$GITHUB_WORKSPACE/kernel_workspace/$BBR_PATCH") \
              || echo "::warning::BBRv3 patch clash ho sakta hai NetHunter/SUSFS patches ke sath, log dekh kar manual merge karo"
          else
            echo "::warning::wild_patches/bbrv3 mein patch file nahi mili — repo structure check karo"
          fi

      # ── 7. Droidspaces patch ──
      - name: Apply Droidspaces patch
        if: ${{ inputs.enable_droidspaces == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          KSRC="${{ steps.paths.outputs.ksrc }}"
          DS_PATCH=$(find wild_patches -iname "*droidspace*" -iname "*.patch" | head -n1)
          if [ -n "$DS_PATCH" ]; then
            (cd "$KSRC" && patch -p1 --fuzz=3 < "$GITHUB_WORKSPACE/kernel_workspace/$DS_PATCH") \
              || echo "::warning::Droidspaces patch conflict, manual review needed"
          else
            echo "::warning::Droidspaces patch nahi mili is repo mein, WildKernels/kernel_patches ka current tree khud verify kar lena"
          fi

      # ── 8. Kali NetHunter kernel patches ──
      - name: Apply Kali NetHunter kernel patches
        if: ${{ inputs.enable_nethunter == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git nh_builder
          KSRC="${{ steps.paths.outputs.ksrc }}"
          # NOTE: yeh repo interactive build.sh menu ke through patches apply karta hai (option 4:
          # "Apply Nethunter kernel patches"). CI mein hum uske patches/ folder se sirf woh patches
          # dhoondh kar apply kar rahe hain jo generic hain (wireless injection, HID, USB gadget waghera).
          # Device-specific defconfig fragments alag se merge karne honge (step 9).
          if [ -d nh_builder/patches ]; then
            for p in $(find nh_builder/patches -iname "*.patch" | sort); do
              echo "Applying: $p"
              (cd "$KSRC" && patch -p1 --fuzz=3 < "$GITHUB_WORKSPACE/kernel_workspace/$p") \
                || echo "::warning::NetHunter patch $p apply nahi hua (conflict ya already-applied), skip kiya"
            done
          else
            echo "::warning::nh_builder/patches folder is version mein nahi mila — GitLab repo tree khud browse karke sahi path daalo"
          fi

      # ── 9. Extra / optional configs merge (Droidspaces, BusyBox-friendly, wireless, USB gadget) ──
      - name: Merge extra defconfig fragments
        working-directory: ${{ steps.paths.outputs.ksrc }}
        run: |
          cat > /tmp/extra.config << 'EOF'
          # NetHunter / BusyBox compatibility
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_TUN=y
          CONFIG_TUN=m
          CONFIG_USB_USBNET=y
          CONFIG_USB_RTL8152=y
          CONFIG_USB_NET_RNDIS_HOST=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_HIDRAW=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=256
          CONFIG_NETFILTER_XT_MATCH_TTL=y
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_OVERLAY_FS=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          # SUSFS
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          # BBRv3
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_BBR3=y
          CONFIG_DEFAULT_TCP_CONG="bbr3"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          EOF
          if [ -n "${{ inputs.extra_defconfig }}" ]; then
            echo "${{ inputs.extra_defconfig }}" | tr ',' '\n' >> /tmp/extra.config
          fi
          ./scripts/kconfig/merge_config.sh -m arch/arm64/configs/${{ inputs.defconfig }} /tmp/extra.config
          cp .config arch/arm64/configs/${{ inputs.defconfig }}

      # ── 10. Kernel compile (Clang/LLVM, official GKI toolchain) ──
      - name: Build kernel
        working-directory: ${{ steps.paths.outputs.ksrc }}
        run: |
          export PATH="${{ steps.paths.outputs.clang }}/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 ${{ inputs.defconfig }}
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # ── 11. AnyKernel3 zip package karo (flashable) ──
      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          KSRC="${{ steps.paths.outputs.ksrc }}"
          IMG=$(find "$KSRC/out/arch/arm64/boot" -name "Image" -o -name "Image.gz-dtb" | head -n1)
          cp "$IMG" anykernel/Image
          cd anykernel
          sed -i 's/^device.name1=.*/device.name1=${{ inputs.device_codename }}/' anykernel.sh || true
          zip -r9 "../NetHunter-GKI510-${{ inputs.device_codename }}-$(date +%Y%m%d).zip" . -x ".git*"

      # ── 12. Upload artifact ──
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-GKI510-${{ inputs.device_codename }}
          path: NetHunter-GKI510-*.zip
          if-no-files-found: error
