name: Build GKI Kernel (SUSFS + KSU-Next + BBRv3 + NetHunter)

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'GKI kernel tag (Google AOSP) - falls back to branch HEAD if tag missing'
        required: true
        default: 'android12-5.10.264'
      susfs_branch:
        description: 'SUSFS4KSU branch (WildKernels fork tracks latest fixes on this branch)'
        required: true
        default: 'gki-android12-5.10'
      enable_bbrv3:
        description: 'Apply BBRv3 congestion control patch (fail-soft)'
        type: boolean
        default: true
      enable_bbg:
        description: 'Apply Baseband Guard'
        type: boolean
        default: true
      enable_ntsync:
        description: 'Enable NTSync'
        type: boolean
        default: true
      enable_droidspaces:
        description: 'Enable Droidspaces (container namespaces)'
        type: boolean
        default: true
      enable_kali_nethunter:
        description: 'Enable Kali NetHunter USB gadget / HID / configfs support (stable, no chipset-specific wifi injection patches)'
        type: boolean
        default: true
      ksu_variant:
        description: 'KernelSU variant'
        type: choice
        options:
          - KernelSU-Next
        default: 'KernelSU-Next'

env:
  KERNEL_ROOT: ${{ github.workspace }}/kernel_workspace
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free up disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true

      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 python3-pip build-essential \
            bc bison flex libssl-dev libelf-dev ccache zip unzip \
            device-tree-compiler rsync

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Set up ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 8G || true

      - name: Sync GKI kernel source (pinned tag, fallback to branch HEAD)
        run: |
          mkdir -p "$KERNEL_ROOT"
          cd "$KERNEL_ROOT"
          TAG="${{ github.event.inputs.kernel_tag }}"
          echo "Attempting to sync manifest at tag: $TAG"
          if ! repo init -u https://android.googlesource.com/kernel/manifest -b "$TAG" --depth=1; then
            echo "::warning::Tag $TAG not found on Google's manifest server. Falling back to branch HEAD (android12-5.10)."
            repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          fi
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle --fail-fast
          echo "kernel_synced=true" >> "$GITHUB_ENV"

      - name: Record base kernel version
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          cd common
          echo "BASE_KVER=$(make kernelversion 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"
          git log -1 --oneline

      - name: Set up KernelSU-Next (Wild KSU)
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "KSU integration attempted."

      - name: Auto-detect latest SUSFS version/tag
        run: |
          # Check the WildKernels susfs4ksu repo's tags AND the upstream simonpunk/susfs4ksu
          # source for whichever is newest, so we always build against the current latest
          # SUSFS release rather than a number pinned in this workflow file.
          LATEST_TAG=$(curl -s "https://api.github.com/repos/WildKernels/susfs4ksu/tags" | \
            grep -m1 '"name"' | sed -E 's/.*"name": *"([^"]+)".*/\1/' || true)
          if [ -n "$LATEST_TAG" ]; then
            echo "Detected latest SUSFS tag: $LATEST_TAG"
            echo "SUSFS_REF=$LATEST_TAG" >> "$GITHUB_ENV"
          else
            echo "No tags found on repo, will use branch HEAD (still 'latest' since the branch tracks upstream commits directly)."
            echo "SUSFS_REF=${{ github.event.inputs.susfs_branch }}" >> "$GITHUB_ENV"
          fi

      - name: Clone SUSFS4KSU (auto-detected latest)
        run: |
          cd "$KERNEL_ROOT"
          if ! git clone --depth=1 -b "$SUSFS_REF" https://github.com/WildKernels/susfs4ksu.git susfs4ksu 2>/dev/null; then
            echo "::warning::Detected ref '$SUSFS_REF' isn't a valid branch on this repo (likely a release tag from a different branch/kernel target) - falling back to the requested branch HEAD, which always carries the latest fixes for that branch."
            git clone --depth=1 -b "${{ github.event.inputs.susfs_branch }}" \
              https://github.com/WildKernels/susfs4ksu.git susfs4ksu
          fi
          cd susfs4ksu
          git log -1 --oneline

      - name: Apply SUSFS patches
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          cd common
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU-Next/ 2>/dev/null || \
            cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/ 2>/dev/null || \
            echo "::warning::KSU susfs enable patch not applied automatically, check patch path manually."
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch . 2>/dev/null || \
            echo "::warning::Version-specific susfs kernel patch file not found under that exact name, listing available patches:" && ls ../susfs4ksu/kernel_patches/ || true
          PATCHFILE=$(ls 50_add_susfs_in_*.patch 2>/dev/null | head -n1)
          if [ -n "$PATCHFILE" ]; then
            patch -p1 --fuzz=3 < "$PATCHFILE" || {
              echo "::warning::SUSFS main patch had rejects. Check *.rej files - manual fixups may be required for full functionality."
            }
          fi
          cp -r ../susfs4ksu/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true

      - name: Report applied SUSFS version
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          VER=$(grep -rhoE 'SUSFS_VERSION[[:space:]]+"[^"]+"' common/ 2>/dev/null | head -n1 || true)
          echo "### SUSFS version actually applied to this build" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$VER" ]; then
            echo "\`$VER\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Could not read SUSFS_VERSION define from source (patch may have failed above) - check the SUSFS patch step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply Baseband Guard (BBG)
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          git clone --depth=1 https://github.com/WildPlusKernel/Baseband-Guard.git ../bbg_tmp || \
            git clone --depth=1 https://github.com/vc-teahouse/Baseband-Guard.git ../bbg_tmp || true
          if [ -d ../bbg_tmp ]; then
            cp -r ../bbg_tmp/* ./security/ 2>/dev/null || echo "::warning::BBG copy step needs manual Kconfig wiring, check upstream README."
          else
            echo "::warning::Could not fetch Baseband Guard source, skipping this feature for this build."
          fi

      - name: Apply BBRv3 congestion control
        if: ${{ github.event.inputs.enable_bbrv3 == 'true' }}
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # NOTE: no single canonical BBRv3 backport exists for android12-5.10 across all trees.
          # This step is intentionally fail-soft: it tries a known community backport and
          # skips cleanly if it doesn't apply, rather than risking a broken TCP stack.
          git clone --depth=1 https://github.com/google/bbr.git ../bbr_tmp 2>/dev/null || true
          if [ -f ../bbr_tmp/net/ipv4/tcp_bbr.c ]; then
            cp ../bbr_tmp/net/ipv4/tcp_bbr.c ./net/ipv4/tcp_bbr.c || true
            echo "::warning::BBRv3 source file copied directly (no patch validation). Build failure here means revert and rely on stock BBR."
          else
            echo "::warning::BBRv3 backport source unavailable/incompatible - leaving stock TCP congestion control untouched to avoid bootloop risk."
          fi

      - name: Apply NTSync
        if: ${{ github.event.inputs.enable_ntsync == 'true' }}
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/gki_defconfig

      - name: Apply Droidspaces (namespace/container support)
        if: ${{ github.event.inputs.enable_droidspaces == 'true' }}
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          for cfg in CONFIG_NAMESPACES CONFIG_UTS_NS CONFIG_IPC_NS CONFIG_PID_NS \
                     CONFIG_NET_NS CONFIG_USER_NS CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE \
                     CONFIG_CGROUPS CONFIG_CGROUP_FREEZER CONFIG_MEMCG; do
            grep -q "^$cfg=" ./arch/arm64/configs/gki_defconfig && \
              sed -i "s/^$cfg=.*/$cfg=y/" ./arch/arm64/configs/gki_defconfig || \
              echo "$cfg=y" >> ./arch/arm64/configs/gki_defconfig
          done

      - name: Apply Kali NetHunter USB gadget / HID / configfs support
        if: ${{ github.event.inputs.enable_kali_nethunter == 'true' }}
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # STABLE, non-chipset-specific NetHunter support: USB gadget + configfs + HID
          # (BadUSB / HID keyboard-injection attacks, USB gadget tooling). No wifi
          # monitor-mode/injection patches here - those were dropped as experimental
          # and unverified for this device's chipset.
          for cfg in CONFIG_USB_GADGET CONFIG_USB_LIBCOMPOSITE CONFIG_USB_CONFIGFS \
                     CONFIG_USB_CONFIGFS_UEVENT CONFIG_USB_CONFIGFS_F_HID \
                     CONFIG_USB_CONFIGFS_F_MASS_STORAGE CONFIG_USB_CONFIGFS_F_ACC \
                     CONFIG_HIDRAW CONFIG_UHID; do
            grep -q "^$cfg=" ./arch/arm64/configs/gki_defconfig && \
              sed -i "s/^$cfg=.*/$cfg=y/" ./arch/arm64/configs/gki_defconfig || \
              echo "$cfg=y" >> ./arch/arm64/configs/gki_defconfig
          done

      - name: Safety - re-run defconfig and verify no duplicate/broken keys
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          sort -u -t= -k1,1 ./arch/arm64/configs/gki_defconfig -o ./arch/arm64/configs/gki_defconfig
          echo "Defconfig deduplicated. Final Droidspaces/NTSync/NetHunter related entries:"
          grep -E "NAMESPACES|USER_NS|SYSVIPC|POSIX_MQUEUE|NTSYNC|USB_CONFIGFS|USB_GADGET|HIDRAW|UHID" ./arch/arm64/configs/gki_defconfig || true

      - name: Build kernel
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$CCACHE_DIR"
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh 2>&1 | tee build.log

      - name: Verify build output exists (fail loudly, don't ship a broken image)
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          IMG=$(find out -name "Image" -o -name "Image.gz" 2>/dev/null | head -n1)
          if [ -z "$IMG" ]; then
            echo "::error::No kernel Image produced - build failed. Aborting before packaging to avoid distributing a broken kernel."
            tail -n 200 build.log
            exit 1
          fi
          echo "IMG_PATH=$IMG" >> "$GITHUB_ENV"

      - name: Package with AnyKernel3
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp "$IMG_PATH" anykernel/Image
          cd anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          zip -r9 ../GKI-kernel-${{ github.event.inputs.kernel_tag }}-$(date +%Y%m%d).zip . -x ".git*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-kernel-flashable-zip
          path: ${{ env.KERNEL_ROOT }}/*.zip
          retention-days: 14

      - name: Upload full build log (for debugging bootloops)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.KERNEL_ROOT }}/build.log
          retention-days: 14
