name: Build Kali NetHunter GKI Kernel (Infinix Hot 40 Pro / MT6789)

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: "GKI android12-5.10 source tag to build"
        required: false
        default: "android12-5.10.264_r00"
      apply_kali_wifi_patch:
        description: "Try to apply Kali NetHunter mac80211 injection patch (best-effort, may fail on 5.10)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      KERNEL_TAG: ${{ github.event.inputs.kernel_tag || 'android12-5.10.264_r00' }}
      OUT_DIR: ${{ github.workspace }}/out
    steps:
      # ------------------------------------------------------------------
      # 1. HOST DEPENDENCIES
      # ------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev \
            libssl-dev libncurses-dev ccache zip curl python3 rsync kmod cpio \
            lz4 device-tree-compiler

      # ------------------------------------------------------------------
      # 2. FETCH KERNEL SOURCE + BUILD SCRIPTS (real AOSP repos, pinned tag)
      #    kernel/common holds the source, kernel/build holds build.sh which
      #    auto-fetches the exact clang version pinned in build.config.constants
      # ------------------------------------------------------------------
      - name: Clone kernel/common (GKI android12-5.10)
        run: |
          git clone https://android.googlesource.com/kernel/common common \
            --branch "$KERNEL_TAG" --depth=1

      - name: Clone kernel/build (build.sh tooling)
        run: |
          git clone https://android.googlesource.com/kernel/build build \
            --branch android12-5.10 --depth=1

      # ------------------------------------------------------------------
      # 3. KERNELSU-NEXT (real, verified installer)
      # ------------------------------------------------------------------
      - name: Integrate KernelSU-Next
        working-directory: common
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      # ------------------------------------------------------------------
      # 4. SUSFS 4 KSU (real gitlab repo, correct android12-5.10 branch)
      # ------------------------------------------------------------------
      - name: Fetch SUSFS4KSU patches
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu \
            -b gki-android12-5.10 --depth=1

      - name: Apply SUSFS to KernelSU-Next
        working-directory: common
        run: |
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/ || true
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch .
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
          cd KernelSU-Next && patch -p1 < 10_enable_susfs_for_ksu.patch || true

      # ------------------------------------------------------------------
      # 5. BBRv3
      #    NOTE: I could not find a verified, currently-maintained BBRv3
      #    backport repo for android12-5.10 to hardcode here without
      #    guessing a URL. Paste the exact repo/branch you already used in
      #    your previous workflow revision below (or tell me and I'll wire
      #    it in) - leaving this as an explicit manual step so nothing
      #    silently no-ops.
      # ------------------------------------------------------------------
      - name: BBRv3 backport (fill in your verified source)
        working-directory: common
        run: |
          echo "TODO: set BBR3_REPO_URL to your verified BBRv3 patch source and uncomment below"
          # git clone <BBR3_REPO_URL> --depth=1 ../bbr3-src
          # patch -p1 < ../bbr3-src/bbrv3_5.10.patch

      # ------------------------------------------------------------------
      # 6. KALI NETHUNTER WIRELESS INJECTION PATCH (best-effort, fail-soft)
      #    Real source: Kali's official NetHunter kernel patch repo. These
      #    patches are historically maintained against much older kernels
      #    (3.x-4.x mac80211 trees) and are NOT guaranteed to apply cleanly
      #    to a 5.10 GKI tree - MT6789 has no known official NetHunter
      #    kernel port. This step tries the closest available patch set and
      #    continues the build even if it fails, so you don't lose the rest
      #    of the pipeline. Expect to hand-resolve rejects for a real device.
      # ------------------------------------------------------------------
      - name: Fetch Kali NetHunter kernel patches (reference)
        if: ${{ github.event.inputs.apply_kali_wifi_patch != 'false' }}
        continue-on-error: true
        run: |
          git clone https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git \
            kali-nethunter-kernel --depth=1

      - name: Attempt mac80211 injection patch (fail-soft)
        if: ${{ github.event.inputs.apply_kali_wifi_patch != 'false' }}
        continue-on-error: true
        working-directory: common
        run: |
          set +e
          CANDIDATE=$(find ../kali-nethunter-kernel/patches -iname "*injection*" -o -iname "*mac80211*" 2>/dev/null | sort | tail -n1)
          if [ -n "$CANDIDATE" ]; then
            echo "Trying candidate patch: $CANDIDATE"
            patch -p1 --dry-run < "$CANDIDATE" && patch -p1 < "$CANDIDATE" \
              || echo "::warning::mac80211 injection patch did not apply cleanly against $KERNEL_TAG - continuing without it, resolve manually if you need packet injection support"
          else
            echo "::warning::No matching Kali mac80211 patch found in repo - skipping"
          fi

      # ------------------------------------------------------------------
      # 7. DEFCONFIG ADDITIONS
      # ------------------------------------------------------------------
      - name: Inject target defconfig fragments
        working-directory: common
        run: |
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          # Kali wireless / external adapter support
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_MAC80211_RC_DEFAULT="minstrel_ht"
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH9K_HTC=m
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL8187=m
          CONFIG_RTL_CARDS=m
          CONFIG_USB_ACM=m
          CONFIG_USB_NET_RNDIS_HOST=m

          # KernelSU-Next + SUSFS
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y

          # BBRv3 (config only - patch step above still required for the
          # actual congestion-control code to exist)
          CONFIG_TCP_CONG_BBR3=y
          CONFIG_DEFAULT_BBR3=y
          EOF

      # ------------------------------------------------------------------
      # 8. BUILD
      #    android12-5.10 predates Bazel-based Kleaf builds, so build.sh is
      #    the correct entrypoint here (Bazel is required from android13+).
      #    build.sh auto-downloads the pinned clang toolchain itself.
      # ------------------------------------------------------------------
      - name: Build GKI kernel
        run: |
          export BUILD_CONFIG=common/build.config.gki.aarch64
          LTO=thin build/build.sh 2>&1 | tee build.log

      - name: Verify build output
        run: |
          test -f out/android12-5.10/dist/Image || { echo "::error::Image not produced"; exit 1; }
          echo "Kernel Image built:"
          ls -la out/android12-5.10/dist/

      # ------------------------------------------------------------------
      # 9. ANYKERNEL3 PACKAGING
      #    NOTE: this uses the upstream AnyKernel3 template. You still need
      #    to edit anykernel.sh for your device's actual partition layout
      #    (Infinix Hot 40 Pro boot/dtbo/vendor_boot slots) before flashing -
      #    the template's defaults target a generic GKI A/B device and are
      #    not guaranteed correct for this exact model.
      # ------------------------------------------------------------------
      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 packaging

      - name: Package flashable zip
        run: |
          cp common/out/android12-5.10/dist/Image packaging/
          cd packaging
          sed -i 's|block=/dev/block/by-name/boot;|block=/dev/block/by-name/boot;\nis_slot_device=1;|g' anykernel.sh
          zip -r9 "../kali-nethunter-ksunext-susfs-5.10.zip" * -x .git

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kali-nethunter-ksunext-susfs-5.10
          path: |
            kali-nethunter-ksunext-susfs-5.10.zip
            build.log
          retention-days: 14
